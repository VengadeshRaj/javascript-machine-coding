<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD using JS</title>
    <link rel="stylesheet" href="./style.css" ></link>
  </head>
  <body>
    <form class="form-container">
      <div class="input-container">
        <label>First Name :</label>
        <input type="text" />
      </div>
       <div class="input-container">
        <label>Last Name :</label>
        <input type="text" />
      </div>
        <div class="input-container">
        <label>Skills :</label>
            <input type="checkbox"/> <label>React</label>
            <input type="checkbox"/> <label>HTML</label>
            <input type="checkbox"/> <label>CSS</label>
      </div>
        <div class="input-container">
        <label>Gender :</label>
            <input type="radio" name="gender"/> <label>Male</label>
            <input type="radio" name="gender"> <label>Female</label>
      </div>
      <div class="input-container">
        <label>Qualification :</label>
            <select>
                <option>B.E</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
            </select>
      </div>
      <div class="input-container"><button type="submit">Submit</button><button>Cancel</button></div>
      
    </form>
    <table>
      <th>
        <tr>
          First Name
        </tr>
        <tr>
          Last Name
        </tr>
        <tr>
          Skills
        </tr>
        <tr>
          Gender
        </tr>
      </th>
      <tbody></tbody>
    </table>
  </body>
</html>
